services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: documind-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - sqlserver

volumes:
  sqlserver_data: